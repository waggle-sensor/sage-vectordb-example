apiVersion: v1
kind: Secret
metadata:
  name: nrp-llm-user-secret
  labels:
    app: sage-image-search
type: Opaque
data:
  # Base64 encoded NRP_API_ENDPOINT and NRP_API_KEY
  # To generate: echo -n "your_username_here" | base64
  # To generate: echo -n "your_password_here" | base64
  NRP_API_ENDPOINT: ""  # Replace with base64 encoded username
  NRP_API_KEY: ""  # Replace with base64 encoded password